<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一問一答 学習アプリ（地理総合・歴史総合）</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F4F7F9;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --correct-color: #2ECC71;
      --correct-bg: #E8F8F5;
      --wrong-color: #E74C3C;
      --wrong-bg: #FDEDEC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 15px;
    }

    header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    /* サイドバー (ハンバーガーメニュー) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 250px;
      height: 100%;
      background-color: var(--card-bg);
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
      z-index: 200;
      padding-top: 60px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li a {
      display: block;
      padding: 15px 20px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .sidebar li a:hover {
      background-color: #f0f0f0;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 150;
    }

    .overlay.active {
      display: block;
    }

    /* メインコンテンツ */
    main {
      flex: 1;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* ボタン共通 */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-secondary {
      background-color: #7F8C8D;
    }

    .btn-answer {
      background-color: #E67E22;
    }

    /* タイトル */
    .section-title {
      font-size: 18px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* テスト画面 */
    .quiz-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 3px solid transparent;
      transition: all 0.3s;
    }

    /* 発光エフェクト */
    .quiz-card.correct {
      border-color: var(--correct-color);
      background-color: var(--correct-bg);
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
    }

    .quiz-card.wrong {
      border-color: var(--wrong-color);
      background-color: var(--wrong-bg);
      box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
    }

    .quiz-header {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .quiz-question {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
    }

    .result-msg {
      font-size: 16px;
      font-weight: bold;
      margin: 15px 0;
      text-align: center;
    }

    .correct-text {
      color: var(--correct-color);
    }

    .wrong-text {
      color: var(--wrong-color);
    }

    .official-answer {
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    /* タブ切り替え (間違えた問題用) */
    .tab-group {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 2px solid #ccc;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
    }

    .tab.active {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
    }

    /* 単語カード (フリップ式) */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .flip-card {
      background-color: transparent;
      width: 100%;
      min-height: 110px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 110px;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 110px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .flip-card-front {
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    .flip-card-back {
      background-color: #2C3E50;
      color: white;
      transform: rotateY(180deg);
    }

    .card-genre {
      font-size: 11px;
      color: #888;
      margin-bottom: 5px;
    }

    .card-hint {
      font-size: 11px;
      color: var(--primary-color);
      margin-top: 8px;
    }

    .card-delete {
      margin-top: 10px;
      padding: 4px 8px;
      font-size: 11px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h1 id="header-title">テスト</h1>
  </header>

  <!-- サイドバー -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <nav class="sidebar" id="sidebar">
    <ul>
      <li><a href="#" onclick="navigate('test')">📝 テスト</a></li>
      <li><a href="#" onclick="navigate('wrong')">❌ 間違えた問題</a></li>
    </ul>
  </nav>

  <!-- メイン画面 -->
  <main>
    <!-- ================= 1. テストページ ================= -->
    <section id="page-test" class="page active">
      
      <!-- STEP 1: 科目選択 -->
      <div id="test-step-subject">
        <h2 class="section-title">科目を選択してください</h2>
        <button class="btn" onclick="selectSubject('geo')">地理総合</button>
        <button class="btn btn-secondary" onclick="selectSubject('history')">歴史総合</button>
      </div>

      <!-- STEP 2-1: 地理総合 ジャンル選択 -->
      <div id="test-step-genre-geo" style="display: none;">
        <h2 class="section-title">地理総合：コースを選択（10問ランダム）</h2>
        <button class="btn" onclick="startQuiz('geo', 1)">ジャンル1：大気循環と気候要素</button>
        <button class="btn" onclick="startQuiz('geo', 2)">ジャンル2：熱帯・乾燥帯の気候と生活</button>
        <button class="btn" onclick="startQuiz('geo', 3)">ジャンル3：温帯の気候と生活</button>
        <button class="btn" onclick="startQuiz('geo', 4)">ジャンル4：亜寒帯・寒帯の気候と生活</button>
        <button class="btn btn-secondary" onclick="startQuiz('geo', 'all')">★ すべてのジャンルから</button>
        <button class="btn btn-secondary" style="background:#95a5a6; margin-top:20px;" onclick="resetTestPage()">← 科目選択に戻る</button>
      </div>

      <!-- STEP 2-2: 歴史総合 ジャンル選択 -->
      <div id="test-step-genre-history" style="display: none;">
        <h2 class="section-title">歴史総合：コースを選択（10問ランダム）</h2>
        <button class="btn" onclick="startQuiz('history', 1)">ジャンル1：第一次世界大戦</button>
        <button class="btn" onclick="startQuiz('history', 2)">ジャンル2：ソ連の成立とアメリカの台頭</button>
        <button class="btn" onclick="startQuiz('history', 3)">ジャンル3：大戦後の国際秩序</button>
        <button class="btn" onclick="startQuiz('history', 4)">ジャンル4：日本の産業革命と世界経済</button>
        <button class="btn btn-secondary" onclick="startQuiz('history', 'all')">★ すべてのジャンルから</button>
        <button class="btn btn-secondary" style="background:#95a5a6; margin-top:20px;" onclick="resetTestPage()">← 科目選択に戻る</button>
      </div>

      <!-- STEP 3: クイズ画面 -->
      <div id="test-step-quiz" style="display: none;">
        <div class="quiz-card" id="quiz-card">
          <div class="quiz-header">
            <span id="quiz-genre-name">ジャンル1</span>
            <span id="quiz-progress">第 1 / 10 問</span>
          </div>
          <div class="quiz-question" id="quiz-question-text">
            問題文がここに入ります。
          </div>

          <div class="input-group">
            <input type="text" id="user-input" placeholder="答えを入力..." autocomplete="off">
          </div>

          <!-- 解答前ボタン -->
          <div id="action-before">
            <button class="btn" onclick="checkAnswer()">判定する</button>
            <button class="btn btn-answer" onclick="giveUp()">答えを表示（わからない）</button>
          </div>

          <!-- 解答後フィードバック -->
          <div id="action-after" style="display: none;">
            <div id="result-message" class="result-msg"></div>
            <div id="official-answer-box" class="official-answer"></div>
            <button class="btn" style="margin-top: 15px;" onclick="nextQuestion()">次へ</button>
          </div>
        </div>
      </div>

      <!-- STEP 4: 結果画面 -->
      <div id="test-step-result" style="display: none; text-align: center;">
        <h2 class="section-title">テスト終了！</h2>
        <div style="font-size: 24px; font-weight: bold; margin: 20px 0;" id="result-score">
          10 問中 0 問正解
        </div>
        <button class="btn" onclick="resetTestPage()">もう一度解く</button>
      </div>

    </section>

    <!-- ================= 2. 間違えた問題ページ ================= -->
    <section id="page-wrong" class="page">
      <div class="tab-group">
        <button class="tab active" id="tab-geo" onclick="switchWrongTab('geo')">地理総合</button>
        <button class="tab" id="tab-history" onclick="switchWrongTab('history')">歴史総合</button>
      </div>

      <div id="wrong-list-container" class="card-list">
        <!-- カードがJavaScriptで動的生成されます -->
      </div>
    </section>
  </main>

  <script>
    /* ==========================================
       問題データ（地理総合）
    ========================================== */
    const geoQuestions = [
      { id: 101, genre: 1, gName: "地理 J1：大気循環", q: "大気で起こる様々な現象を何というか。", a: ["気象"] },
      { id: 102, genre: 1, gName: "地理 J1：大気循環", q: "1年周期で繰り返される大気の状態を何というか。", a: ["気候"] },
      { id: 103, genre: 1, gName: "地理 J1：大気循環", q: "「気候の三要素」とされる3つの要素を答えよ。", a: ["気温・降水量・風", "気温 降水量 風", "気温,降水量,風"] },
      { id: 104, genre: 1, gName: "地理 J1：大気循環", q: "緯度、高度、地形、海流など、気候要素に影響を与える要因を総称して何というか。", a: ["気候因子"] },
      { id: 105, genre: 1, gName: "地理 J1：大気循環", q: "1年の中の最暖月平均気温と最寒月平均気温の差を何というか。", a: ["年較差"] },
      { id: 106, genre: 1, gName: "地理 J1：大気循環", q: "1日の最高気温と最低気温の差を何というか。", a: ["日較差"] },
      { id: 107, genre: 1, gName: "地理 J1：大気循環", q: "大陸西岸のように、偏西風や暖流の影響で気温の日較差・年較差ともに小さくなる気候を何というか。", a: ["海洋性気候"] },
      { id: 108, genre: 1, gName: "地理 J1：大気循環", q: "内陸部のように、気温の日較差・年較差ともに大きくなる気候を何というか。", a: ["大陸性気候"] },
      { id: 109, genre: 1, gName: "地理 J1：大気循環", q: "標高が高くなると気温が低下する割合（気温の減率）は、100mにつき約何℃低下するか。", a: ["約0.65℃", "0.65℃", "0.65"] },
      { id: 110, genre: 1, gName: "地理 J1：大気循環", q: "平地の気温が30℃のとき、標高3776mの富士山山頂の気温は約何℃になるか（100mにつき0.65℃低下として計算）。", a: ["約5.5℃", "5.5℃", "約5.45℃", "5.45℃", "5.5"] },
      { id: 111, genre: 1, gName: "地理 J1：大気循環", q: "赤道付近に形成され、上昇気流が卓越して年間を通して降水量が多くなる気圧帯を何というか。", a: ["赤道低圧帯", "熱帯収束帯"] },
      { id: 112, genre: 1, gName: "地理 J1：大気循環", q: "南北緯度20〜30度付近に位置し、下降気流が卓越するため乾燥する気圧帯を何というか。", a: ["亜熱帯高圧帯", "中緯度高圧帯"] },
      { id: 113, genre: 1, gName: "地理 J1：大気循環", q: "緯度35〜60度付近で、偏西風と極東風がぶつかり降水量が多くなる気圧帯を何というか。", a: ["高緯度低圧帯"] },
      { id: 114, genre: 1, gName: "地理 J1：大気循環", q: "亜熱帯高圧帯から高緯度側に向かって吹き出す風を何というか。", a: ["偏西風"] },
      { id: 115, genre: 1, gName: "地理 J1：大気循環", q: "亜熱帯高圧帯から赤道に向かって吹き出す風を何というか。", a: ["貿易風", "北東貿易風", "南東貿易風"] },
      { id: 116, genre: 1, gName: "地理 J1：大気循環", q: "大陸と海洋の間で、夏と冬に向きがほぼ逆転して吹く風を何というか。", a: ["季節風", "モンスーン"] },
      { id: 117, genre: 1, gName: "地理 J1：大気循環", q: "熱帯低気圧のうち、北西太平洋で発生するものを何というか。", a: ["台風"] },
      { id: 118, genre: 1, gName: "地理 J1：大気循環", q: "熱帯低気圧のうち、大西洋や北東太平洋で発生するものを何というか。", a: ["ハリケーン"] },
      { id: 119, genre: 1, gName: "地理 J1：大気循環", q: "熱帯低気圧のうち、インド洋や南太平洋で発生するものを何というか。", a: ["サイクロン"] },
      { id: 120, genre: 1, gName: "地理 J1：大気循環", q: "植物の分布をもとに世界の気候区分を考案したドイツの気候学者はだれか。", a: ["ケッペン"] },

      { id: 201, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "ケッペンの気候区分において、熱帯（A）の定義となる最寒月平均気温の基準は何℃以上か。", a: ["18℃", "18℃以上", "18"] },
      { id: 202, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "熱帯地域に広く分布する、赤色の土壌を何というか。", a: ["ラトソル"] },
      { id: 203, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "熱帯雨林気候（Af）において、毎日のように午後に降る強い雨を何というか。", a: ["スコール"] },
      { id: 204, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "南アメリカのアマゾン川流域に見られる熱帯雨林の呼称を何というか。", a: ["セルバ"] },
      { id: 205, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "東南アジアなどに見られる熱帯雨林の呼称を何というか。", a: ["ジャングル"] },
      { id: 206, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "熱帯のやせた土地で行われてきた、タロイモやキャッサバなどを栽培する伝統的な農業は何か。", a: ["焼畑農業", "焼畑"] },
      { id: 207, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "かつて欧米諸国の植民地であった地域などで見られる、天然ゴムやカカオなどを大規模に育てる農業形態を何というか。", a: ["プランテーション農業", "プランテーション"] },

      { id: 209, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "季節風（モンスーン）の影響を受けて、弱い乾季がある熱帯の気候（Am）を何というか。", a: ["モンスーン気候", "熱帯モンスーン気候"] },
      { id: 210, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "サバナ気候（Aw）において、夏の雨季をもたらす気圧帯は何か。", a: ["赤道低圧帯", "熱帯収束帯"] },
      { id: 211, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "サバナ気候（Aw）において、冬の乾季をもたらす気圧帯は何か。", a: ["亜熱帯高圧帯", "中緯度高圧帯"] },
      { id: 212, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "サバナ気候に広がる丈の高い草原と疎林のうち、オリノコ川流域での呼び名を何というか。", a: ["リャノ"] },
      { id: 213, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "サバナ気候に広がる丈の高い草原と疎林のうち、ブラジル高原での呼び名を何というか。", a: ["カンポ"] },
      { id: 214, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "インドのデカン高原に分布する、玄武岩が風化した綿花栽培に適した黒色土壌を何というか。", a: ["レグール"] },
      { id: 215, genre: 2, gName: "地理 J2：熱帯・乾燥帯", q: "ブラジル高原に分布する、玄武岩が風化したコーヒーやさとうきび栽培に適した紫色の土壌を何というか。", a: ["テラローシャ"] },

      { id: 4002, genre: 4, gName: "歴史 J4：日本産業革命", q: "1880年代、財政難に苦しむ政府が官営の鉱山・工場などを民間に売り渡した措置を何というか。", a: ["官業払い下げ", "官業払下"] },

      { id: 4006, genre: 4, gName: "歴史 J4：日本産業革命", q: "1883年に開業し、イギリス製機械と蒸気力、昼夜2交代制で成功を収めた紡績会社は何か。", a: ["大阪紡績会社"] },
      { id: 4007, genre: 4, gName: "歴史 J4：日本産業革命", q: "第一国立銀行や大阪紡績会社など多くの企業設立に関わり、「日本資本主義の父」と呼ばれる人物は誰か。", a: ["渋沢栄一"] },
      { id: 4008, genre: 4, gName: "歴史 J4：日本産業革命", q: "手で歯車を回して糸を繰り出す、伝統的な生糸生産の用具・手法を何というか。", a: ["座繰製糸", "座繰り", "座繰り製糸"] },
      { id: 4009, genre: 4, gName: "歴史 J4：日本産業革命", q: "1880年代末から長野県などを中心に発達し、洋式機械を導入して生糸大量生産を可能にした生産方式は何か。", a: ["器械製糸"] },
      { id: 4010, genre: 4, gName: "歴史 J4：日本産業革命", q: "官業払い下げを受けて鉱山や造船所を獲得し、のちに巨大な経済グループへと発展した政商・企業家を何というか。", a: ["財閥"] },
      { id: 4011, genre: 4, gName: "歴史 J4：日本産業革命", q: "第一次世界大戦中の海運業や造船業の空前の好景気によって、急激に富を築いた人々を何と呼んだか。", a: ["船成金", "成金"] },
      { id: 4012, genre: 4, gName: "歴史 J4：日本産業革命", q: "1923年の関東大震災で決済不能となり、のちに不良債権化して金融恐慌の原因となった手形は何か。", a: ["震災手形"] },
      { id: 4103, genre: 4, gName: "歴史 J4：日本産業革命", q: "1927年、震災手形の処理をめぐる発言から銀行への取り付け騒ぎが発生し、休業が相次いだ恐慌は何か。", a: ["金融恐慌"] },
      { id: 4104, genre: 4, gName: "歴史 J4：日本産業革命", q: "浜口雄幸内閣の大蔵大臣として、金解禁（金輸出解禁）を断行した人物は誰か。", a: ["井上準之助"] },
      { id: 4105, genre: 4, gName: "歴史 J4：日本産業革命", q: "1920年代、ワシントン体制のもとで中国への武力干渉を避け、米英との対外協調外交を推進した外務大臣は誰か。", a: ["幣原喜重郎"] }
    ];

    /* ==========================================
       アプリケーションの状態管理
    ========================================== */
    let currentSubject = 'geo';
    let currentQuizList = [];
    let currentQuizIndex = 0;
    let score = 0;
    let wrongQuestions = {
      geo: JSON.parse(localStorage.getItem('wrong_geo') || '[]'),
      history: JSON.parse(localStorage.getItem('wrong_history') || '[]')
    };

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const headerTitle = document.getElementById('header-title');

    /* フィッシャー–イェーツの完全ランダムシャッフル関数 */
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* ハンバーガーメニュー制御 */
    function toggleMenu() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    /* 画面切り替え */
    function navigate(pageName) {
      toggleMenu();
      
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

      if (pageName === 'test') {
        document.getElementById('page-test').classList.add('active');
        headerTitle.innerText = "テスト";
        resetTestPage();
      } else if (pageName === 'wrong') {
        document.getElementById('page-wrong').classList.add('active');
        headerTitle.innerText = "間違えた問題";
        renderWrongList(currentSubject);
      }
    }

    /* 科目選択 */
    function selectSubject(subject) {
      currentSubject = subject;
      document.getElementById('test-step-subject').style.display = 'none';

      if (subject === 'geo') {
        document.getElementById('test-step-genre-geo').style.display = 'block';
        document.getElementById('test-step-genre-history').style.display = 'none';
      } else if (subject === 'history') {
        document.getElementById('test-step-genre-geo').style.display = 'none';
        document.getElementById('test-step-genre-history').style.display = 'block';
      }
    }

    /* テストリセット */
    function resetTestPage() {
      document.getElementById('test-step-subject').style.display = 'block';
      document.getElementById('test-step-genre-geo').style.display = 'none';
      document.getElementById('test-step-genre-history').style.display = 'none';
      document.getElementById('test-step-quiz').style.display = 'none';
      document.getElementById('test-step-result').style.display = 'none';
      currentQuizList = [];
      currentQuizIndex = 0;
      score = 0;
    }

    /* テスト開始（選択科目・ジャンルから10問抽出） */
    function startQuiz(subject, genreTarget) {
      let pool = [];
      const masterData = (subject === 'geo') ? geoQuestions : historyQuestions;

      if (genreTarget === 'all') {
        pool = [...masterData];
      } else {
        pool = masterData.filter(q => q.genre === genreTarget);
      }

      const shuffled = shuffle(pool);
      currentQuizList = shuffled.slice(0, 10);

      currentQuizIndex = 0;
      score = 0;

      document.getElementById('test-step-genre-geo').style.display = 'none';
      document.getElementById('test-step-genre-history').style.display = 'none';
      document.getElementById('test-step-quiz').style.display = 'block';

      showQuestion();
    }

    /* 問題表示 */
    function showQuestion() {
      const qData = currentQuizList[currentQuizIndex];
      const card = document.getElementById('quiz-card');
      
      card.className = "quiz-card";

      document.getElementById('quiz-genre-name').innerText = qData.gName;
      document.getElementById('quiz-progress').innerText = `第 ${currentQuizIndex + 1} / ${currentQuizList.length} 問`;
      document.getElementById('quiz-question-text').innerText = qData.q;
      
      const input = document.getElementById('user-input');
      input.value = "";
      input.disabled = false;
      input.focus();

      document.getElementById('action-before').style.display = 'block';
      document.getElementById('action-after').style.display = 'none';
    }

    /* 解答判定 */
    function checkAnswer() {
      const userInput = document.getElementById('user-input').value.trim();
      if (!userInput) return;

      const qData = currentQuizList[currentQuizIndex];
      const card = document.getElementById('quiz-card');
      const isCorrect = qData.a.some(ans => ans.toLowerCase() === userInput.toLowerCase() || userInput.includes(ans));

      document.getElementById('user-input').disabled = true;
      document.getElementById('action-before').style.display = 'none';
      document.getElementById('action-after').style.display = 'block';

      const resMsg = document.getElementById('result-message');
      const ansBox = document.getElementById('official-answer-box');

      if (isCorrect) {
        card.classList.add('correct');
        resMsg.innerHTML = '<span class="correct-text">正解！ 🎉</span>';
        score++;
      } else {
        card.classList.add('wrong');
        resMsg.innerHTML = '<span class="wrong-text">不正解… 😢</span>';
        addWrongQuestion(currentSubject, qData);
      }

      ansBox.innerText = `模範解答：${qData.a[0]}`;
    }

    /* わからない（答えを表示） */
    function giveUp() {
      const qData = currentQuizList[currentQuizIndex];
      const card = document.getElementById('quiz-card');

      document.getElementById('user-input').disabled = true;
      document.getElementById('action-before').style.display = 'none';
      document.getElementById('action-after').style.display = 'block';

      card.classList.add('wrong');
      document.getElementById('result-message').innerHTML = '<span class="wrong-text">答えを確認しましょう</span>';
      document.getElementById('official-answer-box').innerText = `模範解答：${qData.a[0]}`;

      addWrongQuestion(currentSubject, qData);
    }

    /* 次の問題へ */
    function nextQuestion() {
      currentQuizIndex++;
      if (currentQuizIndex < currentQuizList.length) {
        showQuestion();
      } else {
        document.getElementById('test-step-quiz').style.display = 'none';
        document.getElementById('test-step-result').style.display = 'block';
        document.getElementById('result-score').innerText = `${currentQuizList.length} 問中 ${score} 問正解！`;
      }
    }

    /* 間違えた問題に追加 */
    function addWrongQuestion(subject, qData) {
      const exists = wrongQuestions[subject].some(item => item.id === qData.id);
      if (!exists) {
        wrongQuestions[subject].push(qData);
        localStorage.setItem(`wrong_${subject}`, JSON.stringify(wrongQuestions[subject]));
      }
    }

    /* 間違えた問題の削除 */
    function removeWrongQuestion(subject, qId, event) {
      event.stopPropagation();
      wrongQuestions[subject] = wrongQuestions[subject].filter(item => item.id !== qId);
      localStorage.setItem(`wrong_${subject}`, JSON.stringify(wrongQuestions[subject]));
      renderWrongList(subject);
    }

    /* 間違えた問題 タブ切り替え */
    function switchWrongTab(subject) {
      currentSubject = subject;
      document.getElementById('tab-geo').classList.remove('active');
      document.getElementById('tab-history').classList.remove('active');
      document.getElementById(`tab-${subject}`).classList.add('active');

      renderWrongList(subject);
    }

    /* 間違えた問題 カードリスト描画 */
    function renderWrongList(subject) {
      const container = document.getElementById('wrong-list-container');
      container.innerHTML = "";

      const list = wrongQuestions[subject] || [];

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-msg">間違えた問題はありません 🎉</div>';
        return;
      }

      list.forEach(qData => {
        const card = document.createElement('div');
        card.className = 'flip-card';
        card.onclick = () => card.classList.toggle('flipped');

        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <div class="card-genre">${qData.gName}</div>
              <div style="font-weight:bold; font-size:15px;">${qData.q}</div>
              <div class="card-hint">タップして答えを表示 🔄</div>
            </div>
            <div class="flip-card-back">
              <div style="font-size:12px; opacity:0.8;">答え</div>
              <div style="font-weight:bold; font-size:18px; margin: 8px 0;">${qData.a[0]}</div>
              <button class="card-delete" onclick="removeWrongQuestion('${subject}', ${qData.id}, event)">覚えた（削除）</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Enterキーで判定
    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });
  </script>
