<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一問一答 学習アプリ</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F4F7F9;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --correct-color: #2ECC71;
      --correct-bg: #E8F8F5;
      --wrong-color: #E74C3C;
      --wrong-bg: #FDEDEC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 15px;
    }

    header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    /* サイドバー (ハンバーガーメニュー) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 250px;
      height: 100%;
      background-color: var(--card-bg);
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
      z-index: 200;
      padding-top: 60px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li a {
      display: block;
      padding: 15px 20px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .sidebar li a:hover {
      background-color: #f0f0f0;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 150;
    }

    .overlay.active {
      display: block;
    }

    /* メインコンテンツ */
    main {
      flex: 1;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* ボタン共通 */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-secondary {
      background-color: #7F8C8D;
    }

    .btn-answer {
      background-color: #E67E22;
    }

    /* タイトル */
    .section-title {
      font-size: 18px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* テスト画面 */
    .quiz-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 3px solid transparent;
      transition: all 0.3s;
    }

    /* 発光エフェクト */
    .quiz-card.correct {
      border-color: var(--correct-color);
      background-color: var(--correct-bg);
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
    }

    .quiz-card.wrong {
      border-color: var(--wrong-color);
      background-color: var(--wrong-bg);
      box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
    }

    .quiz-header {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .quiz-question {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
    }

    .result-msg {
      font-size: 16px;
      font-weight: bold;
      margin: 15px 0;
      text-align: center;
    }

    .correct-text {
      color: var(--correct-color);
    }

    .wrong-text {
      color: var(--wrong-color);
    }

    .official-answer {
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    /* タブ切り替え (間違えた問題用) */
    .tab-group {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 2px solid #ccc;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
    }

    .tab.active {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
    }

    /* 単語カード (フリップ式) */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .flip-card {
      background-color: transparent;
      width: 100%;
      min-height: 110px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 110px;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 110px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .flip-card-front {
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    .flip-card-back {
      background-color: #2C3E50;
      color: white;
      transform: rotateY(180deg);
    }

    .card-genre {
      font-size: 11px;
      color: #888;
      margin-bottom: 5px;
    }

    .card-hint {
      font-size: 11px;
      color: var(--primary-color);
      margin-top: 8px;
    }

    .card-delete {
      margin-top: 10px;
      padding: 4px 8px;
      font-size: 11px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h1 id="header-title">テスト</h1>
  </header>

  <!-- サイドバー -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <nav class="sidebar" id="sidebar">
    <ul>
      <li><a href="#" onclick="navigate('test')">📝 テスト</a></li>
      <li><a href="#" onclick="navigate('wrong')">❌ 間違えた問題</a></li>
    </ul>
  </nav>

  <!-- メイン画面 -->
  <main>
    <!-- ================= 1. テストページ ================= -->
    <section id="page-test" class="page active">
      
      <!-- STEP 1: 科目選択 -->
      <div id="test-step-subject">
        <h2 class="section-title">科目を選択してください</h2>
        <button class="btn" onclick="selectSubject('geo')">地理総合</button>
        <button class="btn btn-secondary" onclick="selectSubject('history')">歴史総合</button>
      </div>

      <!-- STEP 2: 地理総合 ジャンル選択 -->
      <div id="test-step-genre" style="display: none;">
        <h2 class="section-title">地理総合：ジャンルを選択（10問出題）</h2>
        <button class="btn" onclick="startQuiz(1)">ジャンル1：大気循環と気候要素</button>
        <button class="btn" onclick="startQuiz(2)">ジャンル2：熱帯・乾燥帯の気候と生活</button>
        <button class="btn" onclick="startQuiz(3)">ジャンル3：温帯の気候と生活</button>
        <button class="btn" onclick="startQuiz(4)">ジャンル4：亜寒帯・寒帯の気候と生活</button>
        <button class="btn btn-secondary" onclick="startQuiz('all')">★ すべて（全ジャンルから）</button>
        <button class="btn btn-secondary" style="background:#95a5a6; margin-top:20px;" onclick="resetTestPage()">← 科目選択に戻る</button>
      </div>

      <!-- STEP 3: クイズ画面 -->
      <div id="test-step-quiz" style="display: none;">
        <div class="quiz-card" id="quiz-card">
          <div class="quiz-header">
            <span id="quiz-genre-name">ジャンル1</span>
            <span id="quiz-progress">第 1 / 10 問</span>
          </div>
          <div class="quiz-question" id="quiz-question-text">
            問題文がここに入ります。
          </div>

          <div class="input-group">
            <input type="text" id="user-input" placeholder="答えを入力..." autocomplete="off">
          </div>

          <!-- 解答前ボタン -->
          <div id="action-before">
            <button class="btn" onclick="checkAnswer()">判定する</button>
            <button class="btn btn-answer" onclick="giveUp()">答えを表示（わからない）</button>
          </div>

          <!-- 解答後フィードバック -->
          <div id="action-after" style="display: none;">
            <div id="result-message" class="result-msg"></div>
            <div id="official-answer-box" class="official-answer"></div>
            <button class="btn" style="margin-top: 15px;" onclick="nextQuestion()">次へ</button>
          </div>
        </div>
      </div>

      <!-- STEP 4: 結果画面 -->
      <div id="test-step-result" style="display: none; text-align: center;">
        <h2 class="section-title">テスト終了！</h2>
        <div style="font-size: 24px; font-weight: bold; margin: 20px 0;" id="result-score">
          10 問中 0 問正解
        </div>
        <button class="btn" onclick="resetTestPage()">もう一度解く</button>
      </div>

    </section>

    <!-- ================= 2. 間違えた問題ページ ================= -->
    <section id="page-wrong" class="page">
      <div class="tab-group">
        <button class="tab active" id="tab-geo" onclick="switchWrongTab('geo')">地理総合</button>
        <button class="tab" id="tab-history" onclick="switchWrongTab('history')">歴史総合</button>
      </div>

      <div id="wrong-list-container" class="card-list">
        <!-- カードがJavaScriptで動的生成されます -->
      </div>
    </section>
  </main>

  <script>
    /* ==========================================
       問題データ（地理総合・プリント準拠）
    ========================================== */
    const geoQuestions = [
      // ジャンル1
      { id: 101, genre: 1, gName: "ジャンル1：大気循環", q: "大気で起こる様々な現象を何というか。", a: ["気象"] },
      { id: 102, genre: 1, gName: "ジャンル1：大気循環", q: "1年周期で繰り返される大気の状態を何というか。", a: ["気候"] },
      { id: 103, genre: 1, gName: "ジャンル1：大気循環", q: "「気候の三要素」とされる3つの要素を答えよ。", a: ["気温・降水量・風", "気温 降水量 風", "気温,降水量,風"] },
      { id: 104, genre: 1, gName: "ジャンル1：大気循環", q: "緯度、高度、地形、海流など、気候要素に影響を与える要因を総称して何というか。", a: ["気候因子"] },
      { id: 105, genre: 1, gName: "ジャンル1：大気循環", q: "1年の中の最暖月平均気温と最寒月平均気温の差を何というか。", a: ["年較差"] },
      { id: 106, genre: 1, gName: "ジャンル1：大気循環", q: "1日の最高気温と最低気温の差を何というか。", a: ["日較差"] },
      { id: 107, genre: 1, gName: "ジャンル1：大気循環", q: "大陸西岸のように、偏西風や暖流の影響で気温の日較差・年較差ともに小さくなる気候を何というか。", a: ["海洋性気候"] },
      { id: 108, genre: 1, gName: "ジャンル1：大気循環", q: "内陸部のように、気温の日較差・年較差ともに大きくなる気候を何というか。", a: ["大陸性気候"] },
      { id: 109, genre: 1, gName: "ジャンル1：大気循環", q: "標高が高くなると気温が低下する割合（気温の減率）は、100mにつき約何℃低下するか。", a: ["約0.65℃", "0.65℃", "0.65"] },
      { id: 110, genre: 1, gName: "ジャンル1：大気循環", q: "平地の気温が30℃のとき、標高3776mの富士山山頂の気温は約何℃になるか（100mにつき0.65℃低下として計算）。", a: ["約5.5℃", "5.5℃", "約5.45℃", "5.45℃", "5.5"] },
      { id: 111, genre: 1, gName: "ジャンル1：大気循環", q: "赤道付近に形成され、上昇気流が卓越して年間を通して降水量が多くなる気圧帯を何というか。", a: ["赤道低圧帯", "熱帯収束帯"] },
      { id: 112, genre: 1, gName: "ジャンル1：大気循環", q: "南北緯度20〜30度付近に位置し、下降気流が卓越するため乾燥する気圧帯を何というか。", a: ["亜熱帯高圧帯", "中緯度高圧帯"] },
      { id: 113, genre: 1, gName: "ジャンル1：大気循環", q: "緯度35〜60度付近で、偏西風と極東風がぶつかり降水量が多くなる気圧帯を何というか。", a: ["高緯度低圧帯"] },
      { id: 114, genre: 1, gName: "ジャンル1：大気循環", q: "亜熱帯高圧帯から高緯度側に向かって吹き出す風を何というか。", a: ["偏西風"] },
      { id: 115, genre: 1, gName: "ジャンル1：大気循環", q: "亜熱帯高圧帯から赤道に向かって吹き出す風を何というか。", a: ["貿易風", "北東貿易風", "南東貿易風"] },
      { id: 116, genre: 1, gName: "ジャンル1：大気循環", q: "大陸と海洋の間で、夏と冬に向きがほぼ逆転して吹く風を何というか。", a: ["季節風", "モンスーン"] },
      { id: 117, genre: 1, gName: "ジャンル1：大気循環", q: "熱帯低気圧のうち、北西太平洋で発生するものを何というか。", a: ["台風"] },
      { id: 118, genre: 1, gName: "ジャンル1：大気循環", q: "熱帯低気圧のうち、大西洋や北東太平洋で発生するものを何というか。", a: ["ハリケーン"] },
      { id: 119, genre: 1, gName: "ジャンル1：大気循環", q: "熱帯低気圧のうち、インド洋や南太平洋で発生するものを何というか。", a: ["サイクロン"] },
      { id: 120, genre: 1, gName: "ジャンル1：大気循環", q: "植物の分布をもとに世界の気候区分を考案したドイツの気候学者はだれか。", a: ["ケッペン"] },

      // ジャンル2
      { id: 201, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "ケッペンの気候区分において、熱帯（A）の定義となる最寒月平均気温の基準は何℃以上か。", a: ["18℃", "18℃以上", "18"] },
      { id: 202, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "熱帯地域に広く分布する、赤色の土壌を何というか。", a: ["ラトソル"] },
      { id: 203, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "熱帯雨林気候（Af）において、毎日のように午後に降る強い雨を何というか。", a: ["スコール"] },
      { id: 204, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "南アメリカのアマゾン川流域に見られる熱帯雨林の呼称を何というか。", a: ["セルバ"] },
      { id: 205, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "東南アジアなどに見られる熱帯雨林の呼称を何というか。", a: ["ジャングル"] },
      { id: 206, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "熱帯のやせた土地で行われてきた、タロイモやキャッサバなどを栽培する伝統的な農業は何か。", a: ["焼畑農業", "焼畑"] },
      { id: 207, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "かつて欧米諸国の植民地であった地域などで見られる、天然ゴムやカカオなどを大規模に育てる農業形態を何というか。", a: ["プランテーション農業", "プランテーション"] },
      { id: 208, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "単一の商品作物の生産や輸出に頼る経済構造を何というか。", a: ["モノカルチャー経済", "モノカルチャー"] },
      { id: 209, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "季節風（モンスーン）の影響を受けて、弱い乾季がある熱帯の気候（Am）を何というか。", a: ["モンスーン気候", "熱帯モンスーン気候"] },
      { id: 210, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "サバナ気候（Aw）において、夏の雨季をもたらす気圧帯は何か。", a: ["赤道低圧帯", "熱帯収束帯"] },
      { id: 211, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "サバナ気候（Aw）において、冬の乾季をもたらす気圧帯は何か。", a: ["亜熱帯高圧帯", "中緯度高圧帯"] },
      { id: 212, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "サバナ気候に広がる丈の高い草原と疎林のうち、オリノコ川流域での呼び名を何というか。", a: ["リャノ"] },
      { id: 213, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "サバナ気候に広がる丈の高い草原と疎林のうち、ブラジル高原での呼び名を何というか。", a: ["カンポ"] },
      { id: 214, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "インドのデカン高原に分布する、玄武岩が風化した綿花栽培に適した黒色土壌を何というか。", a: ["レグール"] },
      { id: 215, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "ブラジル高原に分布する、玄武岩が風化したコーヒーやさとうきび栽培に適した紫色の土壌を何というか。", a: ["テラローシャ"] },
      { id: 216, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "乾燥帯（B）は、年間総降水量よりも「何」が多い地域として定義されるか。", a: ["年間蒸発量", "蒸発量"] },
      { id: 217, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "砂漠気候（BW）において、降水時のみ水が流れる「かれ谷」を何というか。", a: ["ワジ"] },
      { id: 218, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "イランなどで山から水を引く地下水路を何というか（北アフリカでの呼称も答えよ）。", a: ["カナート", "カナート（北アフリカではフォガラ）", "フォガラ"] },
      { id: 219, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "ステップ気候（BS）に広がる短草草原を何というか。", a: ["ステップ"] },
      { id: 220, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "ウクライナのルノーセム帯などに分布する、小麦栽培に最適な世界有数の肥沃な黒色土壌を何というか。", a: ["チェルノーゼム"] },
      { id: 221, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "アメリカのステップ気候帯などに分布する、小麦栽培に適した黒色の土壌を何というか。", a: ["プレーリー土"] },
      { id: 222, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "モンゴルのステップ気候において、羊やヤギなどの放牧を行う人々が住む移動式テントを何というか。", a: ["ゲル"] },
      { id: 223, genre: 2, gName: "ジャンル2：熱帯・乾燥帯", q: "地下水をくみ上げて円形の農地を作る、乾燥地域で見られる農業方式を何というか。", a: ["センターピボット"] },

      // ジャンル3

      { id: 309, genre: 3, gName: "ジャンル3：温帯", q: "ポルトガルやスペインで生産が多く、ワインの栓などに利用される硬葉樹の樹皮は何か。", a: ["コルク", "コルクガシ"] },
      { id: 310, genre: 3, gName: "ジャンル3：温帯", q: "地中海性気候の地域で盛んな、オリーブやぶどうなどの果樹栽培を中心とした農業を何というか。", a: ["地中海式農業"] },
      { id: 311, genre: 3, gName: "ジャンル3：温帯", q: "温暖冬季少雨気候（Cw）において分布する、ツバキなどの樹木群を何というか。", a: ["照葉樹"] },
      { id: 312, genre: 3, gName: "ジャンル3：温帯", q: "温暖冬季少雨気候に属するインド北部で栽培が盛んな、世界的な生産量を誇る農産物は何か。", a: ["茶", "茶葉"] },
      { id: 313, genre: 3, gName: "ジャンル3：温帯", q: "アジアの温帯地域で行われている、1年に同じ耕地で2回米を生産する栽培方法を何というか。", a: ["二期作"] },
      { id: 314, genre: 3, gName: "ジャンル3：温帯", q: "米の生産量が世界第1位の国はどこか。", a: ["中国"] },
      { id: 315, genre: 3, gName: "ジャンル3：温帯", q: "チーズの貿易（輸出）量が世界第1位の国はどこか。", a: ["オランダ"] },

      // ジャンル4
      { id: 401, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯（冷帯・D）の定義となる最寒月平均気温と最暖月平均気温の基準をそれぞれ答えよ。", a: ["最寒月：-3℃未満 ／ 最暖月：10℃以上", "最寒月 -3℃未満 最暖月 10℃以上", "最寒月-3℃未満 最暖月10℃以上"] },
      { id: 402, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯が南半球にはほとんどなく、北半球の高緯度地方のみに分布する理由は何か。", a: ["南半球の高緯度帯に陸地がほとんど存在しないため", "陸地がないため", "陸地が少ないため"] },
      { id: 403, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯の地中に広がっている、年間を通して凍結したままの土壌を何というか。", a: ["永久凍土"] },
      { id: 404, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯の住宅において、暖房の熱で地中の永久凍土が融けて建物が傾くのを防ぐために採用されている構造は何か。", a: ["高床式", "高床の住宅", "高床"] },
      { id: 405, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯地域に広く分布する、低温のため有機物の分解が進まない白っぽい酸性土壌を何というか。", a: ["ポドゾル"] },
      { id: 406, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "シベリアやカナダなどに広がる、広大な針葉樹林帯を何というか。", a: ["タイガ"] },
      { id: 407, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯湿潤気候（Df）の特徴として、1年間の降水量パターンはどうなっているか。", a: ["1年中降水量がある", "年中多雨", "1年中雨が降る"] },
      { id: 408, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "亜寒帯冬季少雨気候（Dw）の特徴として、冬の気候はどうなっているか。", a: ["低温乾燥", "冬低温乾燥"] },
      { id: 409, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "ロシアのサハ共和地に位置し、人が住む地域として史上最低気温（-71.2℃）を記録した集落はどこか。", a: ["オイミャコン"] },
      { id: 410, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "近年、地球温暖化により永久凍土が融解することで地中から大気中に放出され、さらに温暖化を促進させている温室効果ガスは何か。", a: ["メタン", "メタンガス"] },
      { id: 411, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "寒帯（E）の定義となる最暖月平均気温の基準は何℃未満か。", a: ["10℃未満", "10℃", "10"] },
      { id: 412, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "ツンドラ気候（ET）の最暖月平均気温の範囲を答えよ。", a: ["0℃以上10℃未満", "0℃〜10℃", "0度以上10度未満"] },
      { id: 413, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "ツンドラ気候の夏に、氷雪が融けて表面に生育する樹木以外の植物は何か。", a: ["コケ類", "地衣類", "コケ類（地衣類）"] },
      { id: 414, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "ツンドラ気候の地域において、先住民らによって行われている代表的な家畜の遊牧対象は何か。", a: ["トナカイ"] },
      { id: 415, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "北極海沿岸のツンドラ地帯で、アザラシなどの狩猟を行って暮らしてきた先住民を何というか。", a: ["イヌイット"] },
      { id: 416, genre: 4, gName: "ジャンル4：亜寒帯・寒帯", q: "氷雪気候（EF）のように、年中氷雪におおわれ人間が定住できない無居住地域を何というか。", a: ["アネクメーネ"] }
    ];

    /* ==========================================
       アプリケーションの状態管理
    ========================================== */
    let currentQuizList = [];
    let currentQuizIndex = 0;
    let score = 0;
    let wrongQuestions = {
      geo: JSON.parse(localStorage.getItem('wrong_geo') || '[]'),
      history: JSON.parse(localStorage.getItem('wrong_history') || '[]')
    };

    // UI要素
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const headerTitle = document.getElementById('header-title');

    /* ハンバーガーメニュー制御 */
    function toggleMenu() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    /* 画面切り替え（テスト離脱時は自動リセット） */
    function navigate(pageName) {
      toggleMenu();
      
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

      if (pageName === 'test') {
        document.getElementById('page-test').classList.add('active');
        headerTitle.innerText = "テスト";
        resetTestPage(); // テストページ離脱時はリセット
      } else if (pageName === 'wrong') {
        document.getElementById('page-wrong').classList.add('active');
        headerTitle.innerText = "間違えた問題";
        renderWrongList('geo');
      }
    }

    /* テスト：STEP 1 科目選択 */
    function selectSubject(subject) {
      if (subject === 'history') {
        document.getElementById('test-step-subject').style.display = 'none';
        document.getElementById('test-step-genre').style.display = 'none';
        document.getElementById('test-step-quiz').style.display = 'none';
        document.getElementById('test-step-result').style.display = 'none';
      } else if (subject === 'geo') {
        document.getElementById('test-step-subject').style.display = 'none';
        document.getElementById('test-step-genre').style.display = 'block';
      }
    }

    /* テストリセット */
    function resetTestPage() {
      document.getElementById('test-step-subject').style.display = 'block';
      document.getElementById('test-step-genre').style.display = 'none';
      document.getElementById('test-step-quiz').style.display = 'none';
      document.getElementById('test-step-result').style.display = 'none';
      currentQuizList = [];
      currentQuizIndex = 0;
      score = 0;
    }

    /* テスト開始（ジャンル選択から自動的に10問ランダム抽出） */
    function startQuiz(genreTarget) {
      let pool = [];

      if (genreTarget === 'all') {
        pool = [...geoQuestions];
      } else {
        pool = geoQuestions.filter(q => q.genre === genreTarget);
      }

      // ランダムシャッフルして先頭10問を取り出す
      pool.sort(() => Math.random() - 0.5);
      currentQuizList = pool.slice(0, 10);

      currentQuizIndex = 0;
      score = 0;

      document.getElementById('test-step-genre').style.display = 'none';
      document.getElementById('test-step-quiz').style.display = 'block';

      showQuestion();
    }

    /* 問題表示 */
    function showQuestion() {
      const qData = currentQuizList[currentQuizIndex];
      const card = document.getElementById('quiz-card');
      
      // 発光リセット
      card.className = "quiz-card";

      document.getElementById('quiz-genre-name').innerText = qData.gName;
      document.getElementById('quiz-progress').innerText = `第 ${currentQuizIndex + 1} / ${currentQuizList.length} 問`;
      document.getElementById('quiz-question-text').innerText = qData.q;
      
      const input = document.getElementById('user-input');
      input.value = "";
      input.disabled = false;
      input.focus();

      document.getElementById('action-before').style.display = 'block';
      document.getElementById('action-after').style.display = 'none';
    }

    /* 解答判定 */
    function checkAnswer() {
      const userInput = document.getElementById('user-input').value.trim();
      if (!userInput) return;

      const qData = currentQuizList[currentQuizIndex];
      const card = document.getElementById('quiz-card');
      const isCorrect = qData.a.some(ans => ans.toLowerCase() === userInput.toLowerCase() || userInput.includes(ans));

      document.getElementById('user-input').disabled = true;
      document.getElementById('action-before').style.display = 'none';
      document.getElementById('action-after').style.display = 'block';

      const resMsg = document.getElementById('result-message');
      const ansBox = document.getElementById('official-answer-box');

      if (isCorrect) {
        card.classList.add('correct');
        resMsg.innerHTML = '<span class="correct-text">正解！ 🎉</span>';
        score++;
      } else {
        card.classList.add('wrong');
        resMsg.innerHTML = '<span class="wrong-text">不正解… 😢</span>';
        addWrongQuestion('geo', qData);
      }

      ansBox.innerText = `模範解答：${qData.a[0]}`;
    }

    /* わからない（答えを表示） */
    function giveUp() {
      const qData = currentQuizList[currentQuizIndex];
      const card = document.getElementById('quiz-card');

      document.getElementById('user-input').disabled = true;
      document.getElementById('action-before').style.display = 'none';
      document.getElementById('action-after').style.display = 'block';

      card.classList.add('wrong');
      document.getElementById('result-message').innerHTML = '<span class="wrong-text">答えを確認しましょう</span>';
      document.getElementById('official-answer-box').innerText = `模範解答：${qData.a[0]}`;

      addWrongQuestion('geo', qData);
    }

    /* 次の問題へ */
    function nextQuestion() {
      currentQuizIndex++;
      if (currentQuizIndex < currentQuizList.length) {
        showQuestion();
      } else {
        // リザルト
        document.getElementById('test-step-quiz').style.display = 'none';
        document.getElementById('test-step-result').style.display = 'block';
        document.getElementById('result-score').innerText = `${currentQuizList.length} 問中 ${score} 問正解！`;
      }
    }

    /* 間違えた問題に追加 */
    function addWrongQuestion(subject, qData) {
      const exists = wrongQuestions[subject].some(item => item.id === qData.id);
      if (!exists) {
        wrongQuestions[subject].push(qData);
        localStorage.setItem(`wrong_${subject}`, JSON.stringify(wrongQuestions[subject]));
      }
    }

    /* 間違えた問題の削除 */
    function removeWrongQuestion(subject, qId, event) {
      event.stopPropagation();
      wrongQuestions[subject] = wrongQuestions[subject].filter(item => item.id !== qId);
      localStorage.setItem(`wrong_${subject}`, JSON.stringify(wrongQuestions[subject]));
      renderWrongList(subject);
    }

    /* 間違えた問題 タブ切り替え */
    function switchWrongTab(subject) {
      document.getElementById('tab-geo').classList.remove('active');
      document.getElementById('tab-history').classList.remove('active');
      document.getElementById(`tab-${subject}`).classList.add('active');

      renderWrongList(subject);
    }

    /* 間違えた問題 カードリスト描画 */
    function renderWrongList(subject) {
      const container = document.getElementById('wrong-list-container');
      container.innerHTML = "";

      const list = wrongQuestions[subject] || [];

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-msg">間違えた問題はありません 🎉</div>';
        return;
      }

      list.forEach(qData => {
        const card = document.createElement('div');
        card.className = 'flip-card';
        card.onclick = () => card.classList.toggle('flipped');

        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <div class="card-genre">${qData.gName || '歴史総合'}</div>
              <div style="font-weight:bold; font-size:15px;">${qData.q}</div>
              <div class="card-hint">タップして答えを表示 🔄</div>
            </div>
            <div class="flip-card-back">
              <div style="font-size:12px; opacity:0.8;">答え</div>
              <div style="font-weight:bold; font-size:18px; margin: 8px 0;">${qData.a[0]}</div>
              <button class="card-delete" onclick="removeWrongQuestion('${subject}', ${qData.id}, event)">覚えた（削除）</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Enterキーで判定
    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });
  </script>
</body>
